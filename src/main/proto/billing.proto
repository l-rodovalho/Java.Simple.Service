syntax = "proto3";

package billing;

option java_multiple_files = true;
option java_package = "br.com.ifsp.tcc.grpc";

service BillingService {
  rpc ProcessBilling (BillingRequest) returns (BillingResponse);
  rpc CalculateInvoices (CalculateInvoicesRequest) returns (CalculateInvoicesResponse);
}

message BillingRequest {
  string customer_id = 1;
}

message BillingResponse {
  string customer_id = 1;
  string name = 2;
  Metrics metrics = 3;
}

message Metrics {
  int32 invoices_processed = 1;
  string total_paid = 2;
  string total_due_with_interest = 3;
}

message Invoice {
  double amount = 1;
  int32 days_overdue = 2;
  bool paid = 3;
  int32 tier = 4;
}

message CalculateInvoicesRequest {
  repeated Invoice invoices = 1;
  int32 rounds = 2;
}

message CalculateInvoicesResponse {
  int32 invoices_processed = 1;
  string total_paid = 2;
  string total_discount = 3;
  string total_due_with_interest = 4;
}